<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camp Lab | BigLinker</title>
<meta name="description" content="BigLinker Camp Lab: compare family English camps, local schooling, activity camps, medicine and university career camps, in 12 languages.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: yellow search band with "who is it for" tiles, sticky filter bar, card grid, slide-up compare tray. Single brand look (BigLinker yellow / ink / paper). */
:root{
  --yellow:#F2C230;
  --yellow-soft:#FBEBB0;
  --ink:#151515;
  --paper:#F6F3EA;
  --white:#FFFFFF;
  --muted:#5B574E;
  --line:#D9D4C7;
  --rule:#5A574F;
  --green:#2F6B4F;
  --display:'Archivo Black','Arial Black',sans-serif;
  --body:'Noto Sans KR','Noto Sans JP','Noto Sans SC','Noto Sans Thai','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
:lang(ko) body,body:lang(ko){word-break:keep-all}
[hidden]{display:none!important}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.band{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1120px;margin:0 auto}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:0.12em;margin:0}

/* header */
.top{background:var(--ink);color:var(--paper)}
.top .in{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--yellow)}
.brand span{font-weight:700;font-size:15px}
.top a{color:var(--paper);font-size:14px;font-weight:700;text-decoration:none;padding:10px 0}
.top a:hover{text-decoration:underline;text-underline-offset:4px}

/* hero */
.hero{background:var(--yellow);padding-block:36px 40px}
.hero h1{margin:8px 0 10px;font-size:clamp(30px,6vw,52px);font-weight:900;line-height:1.15;text-wrap:balance}
.hero p.sub{margin:0 0 24px;font-size:17px;max-width:640px;font-weight:500}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick button{background:var(--white);border:2px solid var(--ink);padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:84px}
.quick button:hover{background:var(--paper)}
.quick button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.quick button[aria-pressed="true"] small{color:var(--yellow)}
.quick b{font-size:16px;line-height:1.3}
.quick small{font-size:13px;color:var(--muted);line-height:1.4}
@media (max-width:820px){.quick{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.quick{grid-template-columns:1fr}}

/* filter bar */
.filters{background:var(--paper);border-bottom:2px solid var(--ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.filters .in{display:flex;flex-direction:column;gap:10px;padding-block:14px}
@media (max-width:760px),(max-height:700px){.filters{position:static}}
.frow{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.frow::-webkit-scrollbar{display:none}
.frow .k{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--muted);min-width:52px}
.chip{flex:0 0 auto;min-height:38px;padding:0 14px;border:1.5px solid var(--ink);background:var(--white);font-size:14px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.fmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.fmeta strong{font-family:var(--display);font-weight:400;font-size:18px}
.reset{background:none;border:0;text-decoration:underline;text-underline-offset:3px;font-size:14px;padding:8px 0;min-height:38px}
.sort{font:inherit;font-size:14px;border:1.5px solid var(--ink);background:var(--white);min-height:38px;padding:0 10px;border-radius:0}

/* notice */
.notice{background:var(--yellow-soft);border-left:0;padding:12px 16px;font-size:14px;margin:20px 0 0}

/* grid */
.list{padding-block:20px 140px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:20px}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
.card{background:var(--white);border:1.5px solid var(--ink);display:flex;flex-direction:column;min-width:0}
.card .head{padding:16px 18px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;font-weight:700;padding:3px 8px;background:var(--paper)}
.tag.cat{background:var(--ink);color:var(--paper)}
.tag.fam{background:var(--yellow)}
.card h3{margin:0;font-size:18px;line-height:1.35;font-weight:900}
.card .place{font-size:14px;color:var(--muted)}
.card .body{padding:12px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.facts dt{color:var(--muted);font-weight:500}
.facts dd{margin:0;font-weight:500}
.mix{display:flex;flex-direction:column;gap:4px}
.mix .lbl{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700}
.bar{display:flex;height:8px;background:var(--paper)}
.bar i{display:block;height:100%;background:var(--ink)}
.bar i+i{background:var(--yellow)}
.card p.sum{margin:0;font-size:14px;line-height:1.55}
details{font-size:14px;border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
details ul{margin:6px 0 0;padding-left:18px}
.card .foot{display:flex;gap:8px;padding:12px 18px 16px;flex-wrap:wrap}
.btn{min-height:44px;padding:0 16px;font-size:14px;font-weight:700;border:1.5px solid var(--ink);background:var(--white);display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--paper)}
.btn[aria-pressed="true"]{background:var(--yellow)}
.empty{grid-column:1/-1;background:var(--white);border:1.5px dashed var(--ink);padding:32px;text-align:center}

/* compare tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.tray .in{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding-block:10px;flex-wrap:wrap}
.tray .sel{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;min-width:0}
.tray .sel span{background:#2A2A2A;padding:4px 8px;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tray .btn{border-color:var(--yellow)}
.tray .go{background:var(--yellow);color:var(--ink)}
.tray .clear{background:transparent;color:var(--paper);border-color:var(--rule)}

/* compare sheet */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(21,21,21,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet .panel{background:var(--paper);width:100%;max-width:1120px;max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .bar-top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:2px solid var(--ink)}
.sheet h2{margin:0;font-size:20px;font-weight:900}
.sheet .scroll{overflow:auto;padding:12px 16px 20px}
table.cmp{border-collapse:collapse;width:100%;min-width:560px;background:var(--white);font-size:14px}
.cmp th,.cmp td{border:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
.cmp thead th{background:var(--ink);color:var(--paper);font-weight:700;position:sticky;top:0}
.cmp tbody th{background:var(--paper);font-weight:700;white-space:nowrap;width:110px}
.close{min-width:44px;min-height:44px;border:1.5px solid var(--ink);background:var(--white);font-size:20px;line-height:1}

/* how / contact */
.how{background:var(--white);border-top:2px solid var(--ink);padding-block:48px}
.how h2,.contact h2{margin:6px 0 18px;font-size:clamp(24px,4vw,34px);font-weight:900}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;counter-reset:s}
.steps div{border-top:4px solid var(--ink);padding-top:10px}
.steps b{font-family:var(--display);font-weight:400;font-size:24px}
.steps h3{margin:4px 0;font-size:16px}
.steps p{margin:0;font-size:14px;color:var(--muted)}
@media (max-width:760px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.contact{background:var(--ink);color:var(--paper);padding-block:48px 56px}
.contact h2{color:var(--yellow)}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.cbox{border:1.5px solid var(--rule);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.cbox .l{font-size:12px;font-weight:700;color:var(--yellow);letter-spacing:0.08em}
.cbox .v{font-size:17px;font-weight:700;word-break:break-all;user-select:all}
.cbox button{align-self:flex-start;min-height:40px;padding:0 14px;background:var(--yellow);color:var(--ink);border:0;font-weight:700;font-size:14px}
@media (max-width:760px){.cgrid{grid-template-columns:1fr}}
.contact .partner{margin-top:24px;font-size:14px;color:#D6D2C8}
.contact .partner a{color:var(--yellow)}

.top .right{display:flex;align-items:center;gap:14px}
.langsel{display:flex;align-items:center;gap:6px;border:1.5px solid var(--rule);padding:0 8px;min-height:40px}
.langsel svg{flex:0 0 auto}
.langsel select{background:var(--ink);color:var(--paper);border:0;font:inherit;font-size:14px;font-weight:700;min-height:38px;max-width:46vw}
</style>
</head>
<body>

<header class="top band">
  <div class="in">
    <div class="brand"><b>BigLinker</b><span data-i="eyebrowShort">Camp Lab</span></div>
    <div class="right">
      <label class="langsel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg><span class="sr" data-i="langLabel" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Language</span><select id="lang"></select></label>
      <a href="#contact" data-i="contact">Contact</a>
    </div>
  </div>
</header>

<main>
<section class="hero band" aria-labelledby="h1">
  <div class="in">
    <p class="eyebrow" data-i="eyebrow"></p>
    <h1 id="h1" data-i="h1" data-br></h1>
    <p class="sub" data-i="sub"></p>
    <p class="eyebrow" style="margin-bottom:10px" data-i="whoQ"></p>
    <div class="quick" id="quick" role="group">
      <button type="button" data-preset="family" aria-pressed="false"><b data-i="pf_t"></b><small data-i="pf_s"></small></button>
      <button type="button" data-preset="schooling" aria-pressed="false"><b data-i="ps_t"></b><small data-i="ps_s"></small></button>
      <button type="button" data-preset="activity" aria-pressed="false"><b data-i="pa_t"></b><small data-i="pa_s"></small></button>
      <button type="button" data-preset="career" aria-pressed="false"><b data-i="pc_t"></b><small data-i="pc_s"></small></button>
      <button type="button" data-preset="academic" aria-pressed="false"><b data-i="pu_t"></b><small data-i="pu_s"></small></button>
      <button type="button" data-preset="stem" aria-pressed="false"><b data-i="pm_t"></b><small data-i="pm_s"></small></button>
    </div>
  </div>
</section>

<div class="filters band" id="filters">
  <div class="in">
    <div class="frow" role="group"><span class="k" data-i="fCat"></span><span id="f-cat"></span></div>
    <div class="frow" role="group"><span class="k" data-i="fAge"></span><span id="f-age"></span></div>
    <div class="frow" role="group"><span class="k" data-i="fWith"></span><span id="f-with"></span></div>
    <div class="frow" role="group"><span class="k" data-i="fDur"></span><span id="f-dur"></span></div>
    <div class="frow" role="group"><span class="k" data-i="fReg"></span><span id="f-reg"></span></div>
    <div class="fmeta">
      <span id="count" style="font-weight:700"></span>
      <span style="display:flex;gap:12px;align-items:center">
        <label for="sort" style="font-size:13px;font-weight:700;color:var(--muted)" data-i="sort"></label>
        <select id="sort" class="sort">
          <option value="rec" data-i="s_rec"></option>
          <option value="short" data-i="s_short"></option>
          <option value="cost" data-i="s_cost"></option>
          <option value="study" data-i="s_study"></option>
          <option value="act" data-i="s_act"></option>
        </select>
        <button type="button" class="reset" id="reset" data-i="reset"></button>
      </span>
    </div>
  </div>
</div>

<section class="list band">
  <div class="in">
    <p class="notice" data-i="notice" data-html></p>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section class="how band" aria-labelledby="how-t">
  <div class="in">
    <p class="eyebrow" data-i="howE"></p>
    <h2 id="how-t" data-i="howT"></h2>
    <div class="steps">
      <div><b>01</b><h3 data-i="s1t"></h3><p data-i="s1d"></p></div>
      <div><b>02</b><h3 data-i="s2t"></h3><p data-i="s2d"></p></div>
      <div><b>03</b><h3 data-i="s3t"></h3><p data-i="s3d"></p></div>
      <div><b>04</b><h3 data-i="s4t"></h3><p data-i="s4d"></p></div>
    </div>
  </div>
</section>

<section class="contact band" id="contact" aria-labelledby="ct">
  <div class="in">
    <p class="eyebrow" style="color:var(--yellow)" data-i="ctE"></p>
    <h2 id="ct" data-i="ctT"></h2>
    <p style="margin:0 0 20px;max-width:640px" data-i="ctLead"></p>
    <div class="cgrid">
      <div class="cbox"><span class="l" data-i="tel"></span><span class="v" id="c-tel" data-i="telV"></span><button type="button" data-copy="c-tel" data-i="copy"></button></div>
      <div class="cbox"><span class="l" data-i="mail"></span><span class="v" id="c-mail">biglinkerkor@gmail.com</span><button type="button" data-copy="c-mail" data-i="copy"></button></div>
      <div class="cbox"><span class="l" data-i="kakao"></span><span class="v" data-i="kakaoV"></span></div>
    </div>
    <p class="partner"><span data-i="partner"></span> · <a href="../" id="mainlink" data-i="partnerLink"></a></p>
  </div>
</section>
</main>

<div class="tray" id="tray" hidden>
  <div class="in band">
    <div class="sel" id="tray-sel"></div>
    <div style="display:flex;gap:8px">
      <button type="button" class="btn clear" id="tray-clear" data-i="clear"></button>
      <button type="button" class="btn go" id="tray-go"></button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="cmp-t">
  <div class="panel">
    <div class="bar-top"><h2 id="cmp-t" data-i="cmpT"></h2><button type="button" class="close" id="sheet-close">×</button></div>
    <div class="scroll" id="cmp"></div>
  </div>
</div>

<script src="i18n.js"></script>
<script>
/* ─────────────────────────────────────────────────────────────
   캠프 데이터 (구조) — 문구는 i18n.js 의 camps 에 있습니다.
   cat   : 분야 (english, schooling, activity, family, career, academic, stem)
   age   : 대상 (el1 초등 저학년, el2 초등 고학년, ms 중, hs 고, uni 대학)
   with  : 'parent' 부모 동반 / 'solo' 아이 혼자
   weeks : 기간(주)    region : sea, uk, eu, na, oce, kr
   cost  : 1(300만원 미만) · 2(300~600만원) · 3(600만원 이상)
   study : 학습 비중(%)   stay / fmt / staff : i18n.js 의 항목 key
   ※ 모두 '예시' 데이터입니다. 실제 프로그램으로 교체하세요.
   ───────────────────────────────────────────────────────────── */
var CAMPS = [
 {id:'c1', region:'sea', cat:['english','family'], age:['el1','el2'], with:'parent', weeks:3, cost:2, study:60, stay:'resortFam', fmt:'oneSmall', staff:'krManager'},
 {id:'c2', region:'sea', cat:['schooling','family'], age:['el1','el2','ms'], with:'parent', weeks:4, cost:3, study:75, stay:'condo', fmt:'localClass', staff:'localCoord'},
 {id:'c3', region:'oce', cat:['schooling'], age:['el2','ms'], with:'solo', weeks:6, cost:3, study:70, stay:'homestay', fmt:'localClass', staff:'chapTeacher'},
 {id:'c4', region:'uk', cat:['english','activity'], age:['el2','ms'], with:'solo', weeks:2, cost:3, study:50, stay:'dorm', fmt:'intlMixed', staff:'krChap'},
 {id:'c5', region:'na', cat:['activity'], age:['el2','ms'], with:'solo', weeks:2, cost:2, study:20, stay:'cabin', fmt:'counselor', staff:'chap'},
 {id:'c6', region:'kr', cat:['english','activity','family'], age:['el1','el2'], with:'parent', weeks:1, cost:1, study:55, stay:'resort', fmt:'native', staff:'krStaff'},
 {id:'c7', region:'uk', cat:['career'], age:['ms','hs'], with:'solo', weeks:1, cost:3, study:80, stay:'uniDorm', fmt:'seminarSmall', staff:'chap'},
 {id:'c8', region:'eu', cat:['career','stem'], age:['hs'], with:'solo', weeks:2, cost:3, study:85, stay:'uniDorm', fmt:'lab', staff:'chap'},
 {id:'c9', region:'uk', cat:['academic'], age:['hs','uni'], with:'solo', weeks:3, cost:3, study:85, stay:'uniDorm', fmt:'lecture', staff:'localContact'},
 {id:'c10', region:'na', cat:['academic','career'], age:['hs'], with:'solo', weeks:2, cost:3, study:70, stay:'uniDorm', fmt:'seminar', staff:'chap'},
 {id:'c11', region:'uk', cat:['stem'], age:['ms','hs'], with:'solo', weeks:2, cost:3, study:75, stay:'dorm', fmt:'team', staff:'chap'},
 {id:'c12', region:'sea', cat:['stem','english'], age:['el2','ms'], with:'solo', weeks:2, cost:2, study:65, stay:'hotel', fmt:'small', staff:'chapTeacher'},
 {id:'c13', region:'oce', cat:['english','activity','family'], age:['el1','el2'], with:'parent', weeks:2, cost:3, study:45, stay:'famApt', fmt:'small', staff:'localCoord'},
 {id:'c14', region:'sea', cat:['english'], age:['el2','ms','hs'], with:'solo', weeks:4, cost:2, study:85, stay:'dorm', fmt:'oneFour', staff:'krTeacher'}
];
var ORDER = ['ko','en','ja','zh','vi','th','id','es','fr','de','it','pt'];
var PRESETS = {family:{cat:['family'], with:['parent']}, schooling:{cat:['schooling']}, activity:{cat:['activity']}, career:{cat:['career']}, academic:{cat:['academic']}, stem:{cat:['stem']}};
var GROUPS = [['f-cat','cat'],['f-age','age'],['f-with','with'],['f-dur','dur'],['f-reg','reg']];

var lang = 'en';
var state = {cat:[], age:[], with:[], dur:[], reg:[], sort:'rec', preset:null};
var picked = [];
try { var s = JSON.parse(localStorage.getItem('camplab-picked') || '[]'); if (Array.isArray(s)) picked = s.filter(function(id){return CAMPS.some(function(c){return c.id===id;});}); } catch(e) {}

/* 번역 조회: 선택 언어 → 영어 → 한국어 순으로 찾습니다. */
function g(group, key){ var o; [lang,'en','ko'].some(function(l){ var d=I18N[l]&&I18N[l][group]; if(d&&d[key]!=null){o=d[key];return true;} }); return o==null?key:o; }
function u(key, n){ var t=g('ui',key); return n==null?t:String(t).replace('{n}',n); }
function camp(c){ var t=g('camps',c.id); return {title:t[0], place:t[1], summary:t[2], incl:t[3]}; }

function durKey(w){ return w<=1?'w1': w===2?'w2': w<=4?'w3':'w5'; }
function el(tag, attrs, text){ var e=document.createElement(tag); if(attrs) for(var k in attrs){ if(k==='class') e.className=attrs[k]; else e.setAttribute(k, attrs[k]); } if(text!=null) e.textContent=text; return e; }

/* 언어 선택 */
function pickLang(){
  var q=new URLSearchParams(location.search).get('lang'); if(q&&I18N[q]) return q;
  var h=(location.hash||'').slice(1).toLowerCase(); if(I18N[h]) return h;
  try{ var sv=localStorage.getItem('camplab-lang'); if(sv&&I18N[sv]) return sv; }catch(e){}
  try{ var navs=navigator.languages||[navigator.language||'']; for(var i=0;i<navs.length;i++){ var n=String(navs[i]).toLowerCase().split('-')[0]; if(n==='in') n='id'; if(I18N[n]) return n; } }catch(e){}
  return 'en';
}
var sel=document.getElementById('lang');
ORDER.forEach(function(l){ sel.appendChild(el('option',{value:l},LANG_NAMES[l])); });
sel.addEventListener('change', function(){ setLang(sel.value, true); });

function setLang(l, save){
  lang=l; sel.value=l; document.documentElement.lang=l; document.title=u('docTitle');
  if(save){ try{localStorage.setItem('camplab-lang',l);}catch(e){} try{ var url=new URL(location.href); url.searchParams.set('lang',l); if(I18N[url.hash.slice(1)]) url.hash=''; history.replaceState(null,'',url); }catch(e){} }
  document.querySelectorAll('[data-i]').forEach(function(n){
    var k=n.getAttribute('data-i'); var t=k==='eyebrowShort' ? (lang==='ko'?'캠프연구소':lang==='ja'?'キャンプ研究所':lang==='zh'?'营地研究所':'Camp Lab') : u(k);
    if(n.hasAttribute('data-html')) n.innerHTML=t;
    else if(n.hasAttribute('data-br')){ n.textContent=''; String(t).split('\n').forEach(function(p,i){ if(i) n.appendChild(el('br')); n.appendChild(document.createTextNode(p)); }); }
    else n.textContent=t;
  });
  sel.setAttribute('aria-label', u('langLabel'));
  document.getElementById('sheet-close').setAttribute('aria-label', u('close'));
  document.getElementById('mainlink').href='../#'+l;
  GROUPS.forEach(function(gp){ document.querySelectorAll('#'+gp[0]+' .chip').forEach(function(b){ b.textContent=g(gp[1], b.getAttribute('data-v')); }); });
  render();
  if(!document.getElementById('sheet').hidden) openCompare();
}

function buildChips(hostId, key){
  var host=document.getElementById(hostId); host.style.display='contents';
  Object.keys(I18N.ko[key]).forEach(function(k){
    var b=el('button',{type:'button','class':'chip','aria-pressed':'false','data-k':key,'data-v':k});
    b.addEventListener('click', function(){ var arr=state[key], i=arr.indexOf(k); if(i>-1) arr.splice(i,1); else arr.push(k); state.preset=null; render(); });
    host.appendChild(b);
  });
}
GROUPS.forEach(function(gp){ buildChips(gp[0], gp[1]); });

function matches(c){
  if(state.cat.length && !state.cat.every(function(x){return c.cat.indexOf(x)>-1;})) return false;
  if(state.age.length && !state.age.some(function(x){return c.age.indexOf(x)>-1;})) return false;
  if(state.with.length && state.with.indexOf(c.with)<0) return false;
  if(state.dur.length && state.dur.indexOf(durKey(c.weeks))<0) return false;
  if(state.reg.length && state.reg.indexOf(c.region)<0) return false;
  return true;
}
function sorted(list){
  var l=list.slice();
  if(state.sort==='short') l.sort(function(a,b){return a.weeks-b.weeks;});
  if(state.sort==='cost') l.sort(function(a,b){return a.cost-b.cost;});
  if(state.sort==='study') l.sort(function(a,b){return b.study-a.study;});
  if(state.sort==='act') l.sort(function(a,b){return a.study-b.study;});
  return l;
}
function ages(c){ return c.age.map(function(a){return g('age',a);}).join(' · '); }

function card(c){
  var t=camp(c);
  var art=el('article',{'class':'card'});
  var head=el('div',{'class':'head'}); var tags=el('div',{'class':'tags'});
  c.cat.forEach(function(k){ tags.appendChild(el('span',{'class':'tag '+(k==='family'?'fam':'cat')}, g('cat',k))); });
  tags.appendChild(el('span',{'class':'tag'}, u('sample')));
  head.appendChild(tags); head.appendChild(el('h3',null,t.title)); head.appendChild(el('span',{'class':'place'}, t.place));
  art.appendChild(head);
  var body=el('div',{'class':'body'});
  var dl=el('dl',{'class':'facts'});
  [['l_age', ages(c)],['l_with', g('with',c.with)],['l_len', u('weeks',c.weeks)],['l_stay', g('stay',c.stay)],['l_cost', g('cost',c.cost)],['l_staff', g('staff',c.staff)]].forEach(function(r){ dl.appendChild(el('dt',null,u(r[0]))); dl.appendChild(el('dd',null,r[1])); });
  body.appendChild(dl);
  var mix=el('div',{'class':'mix'}); var lbl=el('div',{'class':'lbl'}); lbl.appendChild(el('span',null,u('study')+' '+c.study+'%')); lbl.appendChild(el('span',null,u('act')+' '+(100-c.study)+'%'));
  var bar=el('div',{'class':'bar','role':'img','aria-label':u('study')+' '+c.study+'%, '+u('act')+' '+(100-c.study)+'%'}); var i1=el('i'); i1.style.width=c.study+'%'; var i2=el('i'); i2.style.width=(100-c.study)+'%'; bar.appendChild(i1); bar.appendChild(i2);
  mix.appendChild(lbl); mix.appendChild(bar); body.appendChild(mix);
  body.appendChild(el('p',{'class':'sum'}, t.summary));
  var det=el('details'); det.appendChild(el('summary',null,u('incl'))); var ul=el('ul'); t.incl.forEach(function(x){ ul.appendChild(el('li',null,x)); }); det.appendChild(ul); body.appendChild(det);
  art.appendChild(body);
  var foot=el('div',{'class':'foot'});
  var on=picked.indexOf(c.id)>-1;
  var cb=el('button',{type:'button','class':'btn','aria-pressed':String(on),id:'pick-'+c.id}, on?u('added'):u('add'));
  cb.addEventListener('click', function(){ togglePick(c.id); });
  foot.appendChild(cb); foot.appendChild(el('a',{'class':'btn dark',href:'#contact'}, u('ask'))); art.appendChild(foot);
  return art;
}

function togglePick(id){
  var i=picked.indexOf(id);
  if(i>-1) picked.splice(i,1); else { if(picked.length>=3) picked.shift(); picked.push(id); }
  try{ localStorage.setItem('camplab-picked', JSON.stringify(picked)); }catch(e){}
  render();
}

function render(){
  document.querySelectorAll('.chip').forEach(function(b){ b.setAttribute('aria-pressed', String(state[b.getAttribute('data-k')].indexOf(b.getAttribute('data-v'))>-1)); });
  document.querySelectorAll('#quick button').forEach(function(b){ b.setAttribute('aria-pressed', String(b.getAttribute('data-preset')===state.preset)); });
  var list=sorted(CAMPS.filter(matches));
  var grid=document.getElementById('grid'); grid.textContent='';
  if(!list.length){ var e=el('div',{'class':'empty'}); e.appendChild(el('p',{style:'margin:0 0 12px;font-weight:700'},u('empty1'))); var r=el('button',{type:'button','class':'btn dark'},u('reset')); r.addEventListener('click', reset); e.appendChild(r); e.appendChild(el('p',{style:'margin:12px 0 0;font-size:14px;color:var(--muted)'},u('empty2'))); grid.appendChild(e); }
  list.forEach(function(c){ grid.appendChild(card(c)); });
  document.getElementById('count').textContent=u('count', list.length);
  var tray=document.getElementById('tray'), ts=document.getElementById('tray-sel'); ts.textContent='';
  tray.hidden = picked.length===0;
  ts.appendChild(el('span',{style:'background:none;padding:4px 0;font-weight:700'}, u('tray')+' '+picked.length+'/3'));
  picked.forEach(function(id){ var c=CAMPS.find(function(x){return x.id===id;}); if(c) ts.appendChild(el('span',null,camp(c).title)); });
  var go=document.getElementById('tray-go'); go.disabled = picked.length<2; go.textContent = picked.length<2 ? u('need') : u('go');
}

function reset(){ state.cat=[];state.age=[];state.with=[];state.dur=[];state.reg=[];state.preset=null; render(); }
document.getElementById('reset').addEventListener('click', reset);
document.getElementById('sort').addEventListener('change', function(e){ state.sort=e.target.value; render(); });
document.querySelectorAll('#quick button').forEach(function(b){
  b.addEventListener('click', function(){
    var p=b.getAttribute('data-preset');
    if(state.preset===p){ reset(); return; }
    reset(); var pr=PRESETS[p]; for(var k in pr) state[k]=pr[k].slice(); state.preset=p; render();
    document.getElementById('filters').scrollIntoView({behavior:'smooth', block:'start'});
  });
});
document.getElementById('tray-clear').addEventListener('click', function(){ picked=[]; try{localStorage.removeItem('camplab-picked');}catch(e){} render(); });

var sheet=document.getElementById('sheet');
function openCompare(){
  var cs=picked.map(function(id){return CAMPS.find(function(x){return x.id===id;});}).filter(Boolean);
  var wrap=document.getElementById('cmp'); wrap.textContent='';
  var t=el('table',{'class':'cmp'}); var th=el('thead'); var hr=el('tr'); hr.appendChild(el('th',null,u('item'))); cs.forEach(function(c){ hr.appendChild(el('th',null,camp(c).title)); }); th.appendChild(hr); t.appendChild(th);
  var tb=el('tbody');
  var rows=[['r_field',function(c){return c.cat.map(function(k){return g('cat',k);}).join(' · ');}],['r_place',function(c){return camp(c).place;}],['l_age',ages],['l_with',function(c){return g('with',c.with);}],['l_len',function(c){return u('weeks',c.weeks);}],['r_mix',function(c){return c.study+' : '+(100-c.study);}],['r_format',function(c){return g('fmt',c.fmt);}],['l_stay',function(c){return g('stay',c.stay);}],['l_staff',function(c){return g('staff',c.staff);}],['l_cost',function(c){return g('cost',c.cost);}],['r_incl',function(c){return camp(c).incl.join(', ');}],['r_sum',function(c){return camp(c).summary;}]];
  rows.forEach(function(r){ var tr=el('tr'); tr.appendChild(el('th',{scope:'row'},u(r[0]))); cs.forEach(function(c){ tr.appendChild(el('td',null,r[1](c))); }); tb.appendChild(tr); });
  t.appendChild(tb); wrap.appendChild(t);
  wrap.appendChild(el('p',{style:'font-size:13px;color:var(--muted);margin:12px 0 0'},u('cmpNote')));
  if(sheet.hidden){ sheet.hidden=false; document.getElementById('sheet-close').focus(); }
}
function closeCompare(){ sheet.hidden=true; document.getElementById('tray-go').focus(); }
document.getElementById('tray-go').addEventListener('click', openCompare);
document.getElementById('sheet-close').addEventListener('click', closeCompare);
sheet.addEventListener('click', function(e){ if(e.target===sheet) closeCompare(); });
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && !sheet.hidden) closeCompare(); });

document.querySelectorAll('[data-copy]').forEach(function(b){
  b.addEventListener('click', function(){
    var tx=document.getElementById(b.getAttribute('data-copy'));
    var done=function(){ b.textContent=u('copied'); setTimeout(function(){ b.textContent=u('copy'); },1500); };
    var fb=function(){ var r=document.createRange(); r.selectNodeContents(tx); var s=getSelection(); s.removeAllRanges(); s.addRange(r); };
    try{ navigator.clipboard.writeText(tx.textContent).then(done, fb); }catch(e){ fb(); }
  });
});

/* 링크 예: camplab/?lang=ja#family  — 언어는 ?lang=, 분류는 #family, #schooling, #activity, #career, #academic, #stem */
var h=(location.hash||'').slice(1);
if(PRESETS[h]){ var pr=PRESETS[h]; for(var k in pr) state[k]=pr[k].slice(); state.preset=h; }
setLang(pickLang(), false);
</script>
</body>
</html>
